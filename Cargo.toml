[package]
name = "namespace-tree"
version = "0.1.0"
edition = "2021"
description = "Scans a folder of C# (.cs) files and builds a tree grouped by namespace, with Markdown/JSON/Mermaid export."
license = "MIT"

[[bin]]
name = "namespace-tree"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.4", features = ["derive"] }
regex = "1"
once_cell = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
